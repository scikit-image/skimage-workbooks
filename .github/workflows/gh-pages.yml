name: Build and publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: build_requirements.txt

      # mystmd's book-theme is a Node/npm site under the hood; mystmd
      # 1.13 needs Node 22 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Downloaded/built theme (_build/templates) rarely changes between
      # mystmd versions; keyed on the pin in build_requirements.txt.
      - name: Cache myst theme
        uses: actions/cache@v4
        with:
          path: _build/templates
          key: myst-templates-${{ hashFiles('build_requirements.txt') }}

      # Per-notebook execution outputs are content-addressed, so restoring
      # a cache from an older commit is always safe: unchanged notebooks
      # hit, changed ones just re-execute. Keying on notebook content gives
      # an exact cache hit (no redundant restore/save) on commits that don't
      # touch notebooks at all; restore-keys covers commits that do.
      - name: Cache myst execution
        uses: actions/cache@v4
        with:
          path: |
            _build/execute
            _build/cache
          key: myst-execute-${{ hashFiles('notebooks/**') }}
          restore-keys: |
            myst-execute-

      # scikit-image is installed from git main, which means a slow source
      # build. Cache the wheel, keyed on the upstream commit, so the build
      # only happens when main moves. Once scikit-image publishes nightly
      # wheels, replace the three steps below, and the grep filter under
      # "Install build requirements", with:
      #
      #   pip install --pre --upgrade \
      #     --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
      #     scikit-image

      - name: Resolve scikit-image main
        id: skimage
        run: |
          sha=$(git ls-remote https://github.com/scikit-image/scikit-image.git main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache scikit-image wheel
        id: skimage-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/skimage-wheel
          key: skimage-wheel-${{ runner.os }}-py3.13-${{ steps.skimage.outputs.sha }}

      - name: Build scikit-image wheel
        if: steps.skimage-cache.outputs.cache-hit != 'true'
        run: |
          pip wheel --no-deps -w ~/.cache/skimage-wheel \
            "scikit-image@git+https://github.com/scikit-image/scikit-image@${{ steps.skimage.outputs.sha }}"

      # The git requirement is dropped here; the line above supplies it as a
      # prebuilt wheel, and a VCS requirement would rebuild it regardless.
      - name: Install build requirements
        run: |
          grep -v '^scikit-image@git' build_requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt ~/.cache/skimage-wheel/*.whl

      - name: Build site
        run: make github-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
