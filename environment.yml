name: skimage-workbooks
channels:
  - conda-forge
dependencies:
  - python
  - mystmd
  - ipykernel
  - jupyter-server
  - jupytext
  - sympy
  - setuptools
  - numpy
  - scipy
  - pooch
  - matplotlib
  - pillow
  - imageio
  - pandas
  - tabulate
  - cython
  - diplib
  - itk-filtering
  - pip
  - pip:
      - "scikit-image@git+https://github.com/scikit-image/scikit-image@main"
      - "opencv-python-headless"
